# Android NDK cross-compilation toolchain config.
# - [target.*] linker/ar = used by the Rust linker
# - [env] CC_* = used by cc-rs build scripts (e.g. ring, openssl)
# NDK clang names are versioned (e.g. aarch64-linux-android24-clang);
# cc-rs falls back to the unversioned name which doesn't exist, so we
# set the CC env vars explicitly. API level 24 = Android 7.0 (Tauri min).

[env]
CC_aarch64_linux_android      = "/Users/dustinchang/Library/Android/sdk/ndk/29.0.13846066/toolchains/llvm/prebuilt/darwin-x86_64/bin/aarch64-linux-android24-clang"
CXX_aarch64_linux_android     = "/Users/dustinchang/Library/Android/sdk/ndk/29.0.13846066/toolchains/llvm/prebuilt/darwin-x86_64/bin/aarch64-linux-android24-clang++"
CC_armv7_linux_androideabi    = "/Users/dustinchang/Library/Android/sdk/ndk/29.0.13846066/toolchains/llvm/prebuilt/darwin-x86_64/bin/armv7a-linux-androideabi24-clang"
CXX_armv7_linux_androideabi   = "/Users/dustinchang/Library/Android/sdk/ndk/29.0.13846066/toolchains/llvm/prebuilt/darwin-x86_64/bin/armv7a-linux-androideabi24-clang++"
CC_i686_linux_android         = "/Users/dustinchang/Library/Android/sdk/ndk/29.0.13846066/toolchains/llvm/prebuilt/darwin-x86_64/bin/i686-linux-android24-clang"
CXX_i686_linux_android        = "/Users/dustinchang/Library/Android/sdk/ndk/29.0.13846066/toolchains/llvm/prebuilt/darwin-x86_64/bin/i686-linux-android24-clang++"
CC_x86_64_linux_android       = "/Users/dustinchang/Library/Android/sdk/ndk/29.0.13846066/toolchains/llvm/prebuilt/darwin-x86_64/bin/x86_64-linux-android24-clang"
CXX_x86_64_linux_android      = "/Users/dustinchang/Library/Android/sdk/ndk/29.0.13846066/toolchains/llvm/prebuilt/darwin-x86_64/bin/x86_64-linux-android24-clang++"
AR_aarch64_linux_android      = "/Users/dustinchang/Library/Android/sdk/ndk/29.0.13846066/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-ar"
AR_armv7_linux_androideabi    = "/Users/dustinchang/Library/Android/sdk/ndk/29.0.13846066/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-ar"
AR_i686_linux_android         = "/Users/dustinchang/Library/Android/sdk/ndk/29.0.13846066/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-ar"
AR_x86_64_linux_android       = "/Users/dustinchang/Library/Android/sdk/ndk/29.0.13846066/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-ar"

[target.aarch64-linux-android]
